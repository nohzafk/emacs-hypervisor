<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Hypervisor HUD</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <canvas id="hud-canvas"></canvas>
    <script type="module">
        import init, { start, push_state, push_theme } from "./pkg/hud_wasm.js";

        // Read theme colors handed in via the URL fragment (#bg=...&fg=...).
        // Emacs appends the current theme so the very first paint uses the
        // correct colors instead of flashing the default dark theme.
        function parseInitialTheme() {
            const hash = window.location.hash.replace(/^#/, "");
            if (!hash) return null;
            const params = new URLSearchParams(hash);
            const bg = params.get("bg");
            const fg = params.get("fg");
            if (bg && fg) {
                return JSON.stringify({ bg, fg });
            }
            return null;
        }

        async function run() {
            try {
                await init();
                await start("hud-canvas");

                // Apply the bootstrapped theme immediately, before any state
                // arrives, so there is no dark-to-theme flash.
                const initialTheme = parseInitialTheme();
                if (initialTheme) {
                    try {
                        push_theme(initialTheme);
                    } catch (e) {
                        console.error("Error applying initial theme:", e);
                    }
                }

                // Expose push_state globally so Emacs can run window.hudPushState
                window.hudPushState = (jsonStr) => {
                    try {
                        push_state(jsonStr);
                    } catch (e) {
                        console.error("Error pushing state to egui WASM:", e);
                    }
                };

                window.hudPushTheme = (jsonStr) => {
                    try {
                        push_theme(jsonStr);
                    } catch (e) {
                        console.error("Error pushing theme to egui WASM:", e);
                    }
                };

                console.log("HUD WASM successfully loaded and initialized.");
            } catch (err) {
                console.error("Failed to initialize HUD WASM:", err);
            }
        }

        run();
    </script>
</body>
</html>
