name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pin Elle to a known-good commit so upstream breaking changes (epoch
  # bumps, primitive renames) cannot break CI on an unrelated push.
  # Update this when you intentionally adopt newer Elle.
  ELLE_REF: 2db56eaf6934b89f3b940fd69c7b45c27a159aa0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      - name: Setup just
        uses: extractions/setup-just@v2

      # Cache the Elle checkout so re-runs skip the network fetch.
      # Keyed on the pinned ELLE_REF.
      - name: Cache Elle checkout
        id: cache-elle-src
        uses: actions/cache@v4
        with:
          path: |
            .elle
            !.elle/target
          key: elle-src-${{ env.ELLE_REF }}

      # Cache cargo registry + workspace target dirs. Keyed on lockfiles
      # so the cache invalidates when dependencies change.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            host -> target
            host/elisp_pack -> target
            .elle -> target
          shared-key: hypervisor-ci
          key: ${{ hashFiles('host/Cargo.lock', 'host/elisp_pack/Cargo.toml', '.github/workflows/ci.yml') }}

      - name: Bootstrap Elle
        run: ./scripts/bootstrap-elle

      # scripts/build-hypervisor uses `cargo build --offline --locked`, so the
      # crate registry must be populated before it runs. Network-fetch the
      # host workspace deps; rust-cache stores them for subsequent runs.
      - name: Pre-fetch host dependencies
        run: |
          if [ ! -f host/Cargo.lock ] && [ -f .elle/Cargo.lock ]; then
            cp .elle/Cargo.lock host/Cargo.lock
          fi
          cargo fetch --manifest-path host/Cargo.toml
          cargo fetch --manifest-path host/elisp_pack/Cargo.toml

      - name: Build hypervisor
        run: ./scripts/build-hypervisor

      - name: Run tests
        run: just test

  # Only runs on main, after tests pass. Analyzes conventional commits
  # and opens/updates a release PR with changelog + version bump.
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
