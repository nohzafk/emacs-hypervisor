name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Cache Elle checkout
        id: cache-elle-src
        uses: actions/cache@v4
        with:
          path: |
            .elle
            !.elle/target
          key: elle-src-${{ hashFiles('.elle-ref') }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            host -> target
            host/elisp_pack -> target
            .elle -> target
          shared-key: release-${{ matrix.target }}
          key: ${{ hashFiles('host/Cargo.lock') }}

      - name: Bootstrap Elle
        run: ./scripts/bootstrap-elle

      - name: Pre-fetch host dependencies
        run: |
          if [ ! -f host/Cargo.lock ] && [ -f .elle/Cargo.lock ]; then
            cp .elle/Cargo.lock host/Cargo.lock
          fi
          cargo fetch --manifest-path host/Cargo.toml

      - name: Build
        run: |
          export CARGO_TARGET_DIR="$PWD/target"
          cargo build --release \
            --manifest-path host/Cargo.toml \
            --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/emacs-hypervisor-${{ matrix.target }}.tar.gz" emacs-hypervisor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-hypervisor-${{ matrix.target }}
          path: emacs-hypervisor-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum emacs-hypervisor-*.tar.gz > SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            emacs-hypervisor-*.tar.gz
            SHA256SUMS
